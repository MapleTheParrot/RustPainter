name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          RUST_PAINTER_TEST_TIMEOUT_SCALE: "8"

      - name: Build executable
        run: .\build.ps1

      - name: Write SHA256 checksum
        run: |
          $hash = (Get-FileHash dist\RustPainter.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RustPainter.exe" | Out-File -Encoding ascii dist\RustPainter.exe.sha256
          Write-Host "SHA256: $hash"

      # Always available, so `workflow_dispatch` can produce a test build
      # without cutting a tag.
      - uses: actions/upload-artifact@v4
        with:
          name: RustPainter-windows-x64
          path: |
            dist/RustPainter.exe
            dist/RustPainter.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/RustPainter.exe
            dist/RustPainter.exe.sha256
          generate_release_notes: true

  macos:
    # macos-15 is Apple Silicon, macos-15-intel is x86_64. PySide6 has no
    # universal2 wheel, so each architecture needs its own build. These are the
    # oldest currently-supported images, which also keeps the resulting app
    # compatible with older macOS releases. (macos-13 was retired; macos-14 is
    # deprecated.)
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
          RUST_PAINTER_TEST_TIMEOUT_SCALE: "8"

      - name: Build app bundle
        run: bash build.sh

      - name: Name the archive for this architecture
        run: |
          name="release/RustPainter-macOS-${{ matrix.arch }}.zip"
          mv release/RustPainter-macOS.zip "$name"
          hash=$(shasum -a 256 "$name" | cut -d' ' -f1)
          echo "$hash  RustPainter-macOS-${{ matrix.arch }}.zip" > "$name.sha256"
          echo "SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: RustPainter-macOS-${{ matrix.arch }}
          path: |
            release/RustPainter-macOS-${{ matrix.arch }}.zip
            release/RustPainter-macOS-${{ matrix.arch }}.zip.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/RustPainter-macOS-${{ matrix.arch }}.zip
            release/RustPainter-macOS-${{ matrix.arch }}.zip.sha256
          generate_release_notes: true
